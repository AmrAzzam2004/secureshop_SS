{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create an account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email <input type="email" name="email" value="{{ email }}" maxlength="255" required></label>
    <label>Password <small>(at least 10 characters)</small>
      <input type="password" name="password" minlength="10" maxlength="128" required></label>
    <label>Confirm password <input type="password" name="confirm" maxlength="128" required></label>
    <button class="btn">Register</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
