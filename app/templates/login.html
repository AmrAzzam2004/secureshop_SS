{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email <input type="email" name="email" maxlength="255" required></label>
    <label>Password <input type="password" name="password" maxlength="128" required></label>
    <button class="btn">Log in</button>
  </form>
  <p>New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
